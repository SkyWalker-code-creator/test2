<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Vault | SkyWalker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Подключаем библиотеку для шифрования -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #050505; --bg-side: rgba(15, 15, 18, 0.6); --bg-panel: rgba(25, 25, 30, 0.4);
      --bg-hover: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.1);
      --text: #f0f0f5; --text-dim: #8a8a9a;
      --blue: #569cd6; --purple: #c586c0; --green: #6a9955; --red: #f44747; --orange: #ce9178; --cyan: #4ec9b0;
      --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; font-family: var(--font-sans); background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    /* Окно в стиле VS Code */
    .window { width: 100%; max-width: 900px; height: 80vh; background: rgba(10, 10, 12, 0.7); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 40px 100px rgba(0,0,0,0.9); overflow: hidden; }
    
    .titlebar { background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
    .dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
    .titlebar-center { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }

    /* Экран входа */
    .auth-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .auth-screen h1 { font-family: var(--font-mono); font-size: 24px; color: var(--blue); }
    .auth-screen input { width: 300px; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; outline: none; text-align: center; letter-spacing: 2px; }
    .auth-screen input:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(86,156,214,0.3); }
    .btn { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; font-family: var(--font-mono); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #4a8bc9; box-shadow: 0 0 15px rgba(86,156,214,0.5); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #d13d3d; }
    
    /* Основной интерфейс */
    .vault-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; display: none; }
    .toolbar { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
    .toolbar h2 { font-family: var(--font-mono); font-size: 14px; color: var(--text-dim); letter-spacing: 1px; }
    .add-form { padding: 20px; border-bottom: 1px solid var(--border); display: none; gap: 10px; background: rgba(255,255,255,0.02); }
    .add-form input { flex: 1; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font-mono); font-size: 13px; outline: none; }
    .add-form input:focus { border-color: var(--blue); }
    
    .passwords-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .pass-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .pass-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(86,156,214,0.3); }
    .pass-info { display: flex; flex-direction: column; gap: 4px; }
    .pass-service { font-weight: bold; color: var(--text); font-size: 15px; }
    .pass-login { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .pass-password { font-family: var(--font-mono); font-size: 14px; color: var(--green); letter-spacing: 2px; }
    .pass-actions { display: flex; gap: 8px; }
    .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 4px; transition: 0.2s; }
    .icon-btn:hover { color: var(--text); transform: scale(1.1); }
    .icon-btn.copy:hover { color: var(--cyan); }
    .icon-btn.delete:hover { color: var(--red); }
    
    .empty-state { text-align: center; color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; margin-top: 40px; }
    
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .scroll::-webkit-scrollbar-thumb:hover { background: rgba(86,156,214,0.6); }
  </style>
</head>
<body>

  <div class="window">
    <div class="titlebar">
      <div class="dots">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
      </div>
      <div class="titlebar-center">Secure Vault - Local Storage</div>
    </div>

    <!-- Экран ввода мастер-пароля -->
    <div class="auth-screen" id="authScreen">
      <h1>🔒 VAULT ACCESS</h1>
      <p style="color:var(--text-dim); font-size: 13px; font-family: var(--font-mono);">Введите мастер-пароль для расшифровки</p>
      <input type="password" id="masterPass" placeholder="••••••••" autocomplete="off">
      <button class="btn btn-primary" onclick="Vault.unlock()">Разблокировать</button>
      <div id="authError" style="color: var(--red); font-size: 12px; font-family: var(--font-mono); height: 15px;"></div>
    </div>

    <!-- Основной экран -->
    <div class="vault-screen" id="vaultScreen">
      <div class="toolbar">
        <h2>// MY_PASSWORDS</h2>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="Vault.showAddForm()">+ Добавить</button>
          <button class="btn btn-danger" onclick="Vault.lock()">Заблокировать</button>
        </div>
      </div>
      
      <div class="add-form" id="addForm">
        <input type="text" id="newService" placeholder="Сервис (например, GitHub)">
        <input type="text" id="newLogin" placeholder="Логин / Email">
        <input type="text" id="newPassword" placeholder="Пароль">
        <button class="btn btn-primary" onclick="Vault.saveItem()">Сохранить</button>
      </div>

      <div class="passwords-list scroll" id="passwordsList">
        <!-- Сюда падают пароли -->
      </div>
    </div>
  </div>

  <script>
    const Vault = {
      masterPassword: null,
      data: [],

      // Проверка при входе
      unlock() {
        const pass = document.getElementById('masterPass').value;
        if (!pass) return;

        const encrypted = localStorage.getItem('skywalker_vault');
        
        if (encrypted) {
          try {
            const bytes = CryptoJS.AES.decrypt(encrypted, pass);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            if (!decrypted) throw new Error("Wrong password");
            
            this.data = JSON.parse(decrypted);
            this.masterPassword = pass;
            this.showVault();
          } catch (e) {
            document.getElementById('authError').textContent = 'Неверный пароль!';
            document.getElementById('masterPass').value = '';
          }
        } else {
          // Первый запуск - создаем новое хранилище
          this.masterPassword = pass;
          this.data = [];
          this.saveToLocal();
          this.showVault();
        }
      },

      showVault() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('vaultScreen').style.display = 'flex';
        document.getElementById('masterPass').value = '';
        document.getElementById('authError').textContent = '';
        this.render();
      },

      lock() {
        this.masterPassword = null;
        this.data = [];
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('vaultScreen').style.display = 'none';
        document.getElementById('masterPass').value = '';
      },

      // Шифрование и сохранение
      saveToLocal() {
        const jsonStr = JSON.stringify(this.data);
        const encrypted = CryptoJS.AES.encrypt(jsonStr, this.masterPassword).toString();
        localStorage.setItem('skywalker_vault', encrypted);
      },

      showAddForm() {
        const form = document.getElementById('addForm');
        form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
        if (form.style.display === 'flex') document.getElementById('newService').focus();
      },

      saveItem() {
        const service = document.getElementById('newService').value.trim();
        const login = document.getElementById('newLogin').value.trim();
        const password = document.getElementById('newPassword').value.trim();

        if (!service || !password) {
          alert('Заполните хотя бы название сервиса и пароль!');
          return;
        }

        this.data.push({ id: Date.now(), service, login, password });
        this.saveToLocal();
        
        // Очищаем форму
        document.getElementById('newService').value = '';
        document.getElementById('newLogin').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('addForm').style.display = 'none';
        
        this.render();
      },

      deleteItem(id) {
        if (!confirm('Удалить этот пароль?')) return;
        this.data = this.data.filter(item => item.id !== id);
        this.saveToLocal();
        this.render();
      },

      copyPassword(password) {
        navigator.clipboard.writeText(password).then(() => {
          alert('Пароль скопирован в буфер обмена!');
        });
      },

      render() {
        const list = document.getElementById('passwordsList');
        list.innerHTML = '';

        if (this.data.length === 0) {
          list.innerHTML = '<div class="empty-state">Хранилище пусто. Добавьте первый пароль!</div>';
          return;
        }

        // Выводим в обратном порядке (новые сверху)
        [...this.data].reverse().forEach(item => {
          const el = document.createElement('div');
          el.className = 'pass-item';
          el.innerHTML = `
            <div class="pass-info">
              <div class="pass-service">${item.service}</div>
              <div class="pass-login">${item.login || 'Логин не указан'}</div>
              <div class="pass-password" id="pass-${item.id}">••••••••</div>
            </div>
            <div class="pass-actions">
              <button class="icon-btn" onclick="document.getElementById('pass-${item.id}').textContent = document.getElementById('pass-${item.id}').textContent === '••••••••' ? '${item.password}' : '••••••••'" title="Показать/Скрыть">👁</button>
              <button class="icon-btn copy" onclick="Vault.copyPassword('${item.password}')" title="Копировать">📋</button>
              <button class="icon-btn delete" onclick="Vault.deleteItem(${item.id})" title="Удалить">🗑</button>
            </div>
          `;
          list.appendChild(el);
        });
      }
    };

    // Вход по Enter
    document.getElementById('masterPass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') Vault.unlock();
    });
  </script>
</body>
</html>
